<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <!-- Heading -->
        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-header bg-primary text-white text-center py-4">
                <h2 class="mb-1">✈️ Travel Details</h2>
                <p class="mb-0">Registered Travel Information</p>
            </div>

            <div class="card-body p-4">

                <!-- Travel Table -->
                <div class="table-responsive">

                    <table class="table table-bordered table-hover align-middle text-center">

                        <thead class="table-dark">
                            <tr>
                                <th>Sr. No.</th>
                                <th>Country</th>
                                <th>Days</th>
                                <th>Cost</th>
                                <th colspan="2">Actios</th>
                            </tr>
                        </thead>

                        <tbody>
                            {%for travel in travels%}
                            <tr>
                                <td>{{forloop.counter}}</td>
                                <td>{{travel.country}}</td>
                                <td>{{travel.days}}</td>
                                <td>{{travel.cost}}</td>
                                <td><a href="{%url 'delete'%}?id={{travel.id}}" class="btn btn-danger">Delete</a></td>
                                
                            </tr>
                            {%endfor%}

                        </tbody>

                    </table>

                </div>

                <!-- Back Button -->
                <div class="text-center mt-4">

                    <a href="{%url 'index'%}"
                       class="btn btn-primary">
                        ⬅️ Back to Registration
                    </a>

                </div>

            </div>

            <!-- Footer -->
            <div class="card-footer text-center text-muted">
                🌎 Explore • Travel • Enjoy
            </div>

        </div>

    </div>

</body>

</html>
