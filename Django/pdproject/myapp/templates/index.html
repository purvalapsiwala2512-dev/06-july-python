<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow p-4">
        {%if st%}
        <h3 class="mb-0">Update Registration</h3>
        {%else%}
        <h3 class="mb-0">Course Registration</h3>
        {%endif%}

        <h2 class="text-center mb-4">Course Form</h2>
        <span class="text-success">{{msg}}</span>
        <form action="{%url 'register'%}" method="POST">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{st.id}}">
            <div class="mb-3">
                <label class="form-label">Course Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Enter course name"
                       value="{{st.name}}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Duration</label>
                <input type="text"
                       name="duration"
                       class="form-control"
                       placeholder="Enter duration (e.g. 6 Months)"
                       value="{{st.duration}}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Fees</label>
                <input type="number"
                       name="fees"
                       class="form-control"
                       placeholder="Enter fees"
                       value="{{st.fees}}"
                       required>
            </div>
             <div class="d-grid gap-2">
                                {%if st%}
                                <button type="submit" class="btn btn-primary">
                                    Update Course
                                </button>
                                {%else%}
                                <button type="submit" class="btn btn-primary">
                                    Register Course
                                </button>
                                {%endif%}

                                <button type="reset" class="btn btn-secondary">
                                    Clear
                                </button>

                                <a href="{%url 'display'%}" class="btn btn-warning">display</a>
                            </div>
        </form>

    </div>

</div>

</body>
</html>
