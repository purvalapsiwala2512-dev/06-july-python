<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Registration</title>

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        /* Page Background */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2ff, #f3e8ff);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Card */
        .product-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        /* Card Header */
        .product-header {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .product-header h3 {
            margin: 0;
            font-weight: 700;
        }

        .product-header p {
            margin: 5px 0 0;
            opacity: 0.9;
        }

        /* Card Body */
        .card-body {
            padding: 30px;
            background: white;
        }

        /* Labels */
        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        /* Inputs */
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #ced4da;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #6610f2;
            box-shadow: 0 0 0 0.2rem rgba(102, 16, 242, 0.15);
        }

        /* Buttons */
        .btn {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-register {
            background: linear-gradient(90deg, #0d6efd, #6610f2);
            border: none;
            color: white;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.3);
            color: white;
        }

        .btn-display {
            margin-top: 10px;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card product-card">

                <!-- Header -->
                <div class="product-header">

                    <div class="fs-1">📦</div>

                    <h3>Product Registration</h3>

                    <p>Add a new product to your inventory</p>

                </div>


                <!-- Form -->
                <div class="card-body">

                    <form action="{%url 'register'%}" method="post">

                        {% csrf_token %}

                        <!-- Product Name -->
                        <div class="mb-4">

                            <label class="form-label">
                                Product Name
                            </label>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="Enter product name"
                                   required>

                        </div>


                        <!-- Price -->
                        <div class="mb-4">

                            <label class="form-label">
                                Price
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">₹</span>

                                <input type="number"
                                       name="price"
                                       class="form-control"
                                       placeholder="Enter product price"
                                       step="0.01"
                                       required>

                            </div>

                        </div>


                        <!-- Quantity -->
                        <div class="mb-4">

                            <label class="form-label">
                                Quantity
                            </label>

                            <input type="number"
                                   name="qty"
                                   class="form-control"
                                   placeholder="Enter quantity"
                                   min="1"
                                   required>

                        </div>


                        <!-- Buttons -->
                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-register">
                                ➕ Register Product
                            </button>

                            <a href="{% url 'display' %}"
                               class="btn btn-outline-primary btn-display">
                                📋 View Products
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
