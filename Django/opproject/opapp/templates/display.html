<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fb;
        }

        /* Product Heading */
        .product-title {
            font-weight: 700;
            color: #343a40;
        }

        /* Table Box */
        .product-table {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            background-color: white;
        }

        /* Gradient Header */
        .product-header {
            background: linear-gradient(90deg, #0d6efd, #6610f2);
            color: white;
        }

        .product-header th {
            padding: 15px;
            font-size: 16px;
        }

        /* Table Body */
        .product-table tbody td {
            padding: 14px;
            vertical-align: middle;
        }

        /* Hover Effect */
        .product-table tbody tr:hover {
            background-color: #eef4ff;
        }
    </style>

</head>

<body>

    <div class="container mt-5">

        <!-- Heading -->
        <h2 class="text-center mb-4 product-title">
            📦 Product List
        </h2>

        <div class="table-responsive">

            <table class="table table-bordered table-striped table-hover product-table">

                <!-- Gradient Header -->
                <thead class="product-header">
                    <tr>
                        <th>Sr. No.</th>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th colspan="2">Actions</th>
                    </tr>
                </thead>

                <!-- Product Data -->
                <tbody>
                    {% for product in products %}

                    <tr>
                        <td>{{forloop.counter}}</td>
                        <td>{{product.name}}</td>
                        <td>{{product.price}}</td>
                        <td>{{product.qty}}</td>
                        <td><a href="{%url 'delete'%}?id={{product.id}}" class="btn btn-danger"></a>Delete</td>
                        <td><a href="" class="btn btn-warning">Update</a></td>
                        
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

            <a href="{% url 'index' %}" class="btn btn-success">
                Back to Registration
            </a>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
